<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <title>For Alaina</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b3d91;
      background: radial-gradient(ellipse at center, #1e5bd8 0%, #0b3d91 55%, #061f4f 100%);
      font-family: Georgia, "Times New Roman", serif;
      color: #fff;
    }
    .heart {
      position: fixed;
      top: -10vh;
      color: #ff4d6d;
      user-select: none;
      pointer-events: none;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      text-shadow: 0 0 8px rgba(255, 120, 150, 0.6);
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(115vh) rotate(360deg); opacity: 0.8; }
    }
    .message {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }
    h1 {
      font-size: clamp(2.5rem, 9vw, 6rem);
      margin: 0;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    #or {
      max-width: 900px;
      margin-top: 1.5rem;
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-style: italic;
      line-height: 1.35;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    #or.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>Will You Marry Me?</h1>
    <p id="or">Or Just Love You Like You Did In Crack Hotels When I First Started This Shit?</p>
  </div>

  <script>
    var hearts = ["❤", "♥", "💖", "💕"];

    function makeHeart() {
      var h = document.createElement("div");
      h.className = "heart";
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (16 + Math.random() * 30) + "px";
      h.style.animationDuration = (4 + Math.random() * 5) + "s";
      document.body.appendChild(h);
      h.addEventListener("animationend", function () { h.remove(); });
    }

    setInterval(makeHeart, 250);

    setTimeout(function () {
      document.getElementById("or").classList.add("show");
    }, 5000);
  </script>
</body>
</html>
