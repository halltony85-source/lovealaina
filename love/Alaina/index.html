<title>Will You Marry Me?</title>

<body bgcolor="#0000FF" text="#FFFFFF">

<script language="JavaScript">
<!-- Begin
// Falling Hearts Script
// Based on the snow script from dynamicdrive / altan
// Free to use as long as this credit stays intact!!

var no = 25; // number of hearts
var speed = 20; // smaller number moves the hearts faster
var heart = "&hearts;";

var dx, xp, yp;    // coordinate and position variables
var am, stx, sty;  // amplitude and step variables
var i, doc_width = 800, doc_height = 600;

doc_width = document.body.clientWidth;
doc_height = document.body.clientHeight;
if (doc_height < 400) doc_height = window.innerHeight;

dx = new Array();
xp = new Array();
yp = new Array();
am = new Array();
stx = new Array();
sty = new Array();

for (i = 0; i < no; ++ i) {
  dx[i] = 0;                        // set coordinate variables
  xp[i] = Math.random()*(doc_width-50);  // set position variables
  yp[i] = Math.random()*doc_height;
  am[i] = Math.random()*20;         // set amplitude variables
  stx[i] = 0.02 + Math.random()/10; // set step variables
  sty[i] = 0.7 + Math.random();     // set step variables
  document.write("<div id=\"dot"+ i +"\" style=\"POSITION: absolute; Z-INDEX: "+ i +"; VISIBILITY: visible; TOP: 15px; LEFT: 15px;\"><font color=\"#FF0000\" size=\"5\">"+heart+"</font></div>");
}

function heartFall() {
  for (i = 0; i < no; ++ i) {
    yp[i] += sty[i];
    if (yp[i] > doc_height-50) {
      xp[i] = Math.random()*(doc_width-am[i]-30);
      yp[i] = 0;
      stx[i] = 0.02 + Math.random()/10;
      sty[i] = 0.7 + Math.random();
    }
    dx[i] += stx[i];
    document.getElementById("dot"+i).style.top = yp[i] + "px";
    document.getElementById("dot"+i).style.left = xp[i] + am[i]*Math.sin(dx[i]) + "px";
  }
  setTimeout("heartFall()", speed);
}

heartFall();
// End -->
</script>

<br><br><br><br><br><br>

<font face="Times New Roman" size="5"><i>Or Just Love You Like You Did In Crack Hotels When I First Started This Shit?</i></font>
</div>

</script>

</body>
